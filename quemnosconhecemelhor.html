<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quem Nos Conhece Melhor? 💕</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  min-height: 100dvh;
  background: radial-gradient(circle at top, #1b1042 0%, #0a0620 60%, #050310 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 900px;
}

/* =========================
   TÍTULO
========================= */

h1 {
  text-align: center;
  font-size: 2rem;
  background: linear-gradient(90deg,#ffd166,#ff5da2,#ffd166);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  color: #c9b8ff;
  margin-bottom: 20px;
  font-size: 0.95rem;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* =========================
   CARD
========================= */

.card {
  background: linear-gradient(145deg,#1c1240,#100a2a);
  border: 2px solid #5b3aa0;
  border-radius: 20px;
  padding: 24px;
  box-shadow:
    0 0 40px rgba(150,90,255,0.35),
    inset 0 0 20px rgba(255,255,255,0.03);
}

/* =========================
   SETUP
========================= */

.input-group {
  margin-bottom: 20px;
}

.input-group label {
  display: block;
  margin-bottom: 8px;
  color: #ffd166;
  font-weight: 600;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 2px solid #5b3aa0;
  background: #0f0a26;
  color: #fff;
  font-size: 1rem;
  outline: none;
}

.input-group input:focus {
  border-color: #ff5da2;
}

/* =========================
   BOTÕES
========================= */

.btn {
  display: inline-block;
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(90deg,#ff5da2,#ffd166);
  color: #1a0e35;
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  letter-spacing: 0.5px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,93,162,0.45);
}

.btn:active {
  transform: translateY(0);
}

.btn.secondary {
  background: transparent;
  border: 2px solid #ff5da2;
  color: #ff5da2;
}

/* ==================================================
   GAME SCREEN
================================================== */

#game-screen {
  width: 100%;
}

.game-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 210px;
  gap: 14px;
  align-items: stretch;
}

/* =========================
   PARTE PRINCIPAL DO JOGO
========================= */

.game-layout > .card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  gap: 8px;
}

.question-count {
  color: #c9b8ff;
  font-size: 0.85rem;
}

.timer-wrap {
  height: 7px;
  width: 100%;
  background: #2a1c55;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 12px;
}

.timer-bar {
  height: 100%;
  background: linear-gradient(90deg,#ff5da2,#ffd166);
  width: 100%;
  transition: width 1s linear;
}

.turn-banner {
  text-align: center;
  padding: 9px 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-weight: 700;
  font-size: 0.88rem;
  line-height: 1.25;
}

.turn-banner.secret {
  background: rgba(255,93,162,0.15);
  border: 1px solid #ff5da2;
  color: #ffb6d5;
}

.turn-banner.guess {
  background: rgba(255,209,102,0.12);
  border: 1px solid #ffd166;
  color: #ffe9b0;
}

.question-text {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 14px;
  line-height: 1.3;
  min-height: 48px;
  display: flex;
  align-items: center;
}

/* =========================
   RESPOSTAS
========================= */

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.option {
  background: #150c33;
  border: 2px solid #4a3080;
  border-radius: 11px;
  padding: 11px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 54px;
  line-height: 1.2;
}

.option:hover {
  border-color: #ff5da2;
  background: #1d1244;
}

.option .letter {
  background: #5b3aa0;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  flex-shrink: 0;
  font-size: 0.8rem;
}

.option.correct {
  border-color: #4ade80;
  background: rgba(74,222,128,0.15);
}

.option.wrong {
  border-color: #f87171;
  background: rgba(248,113,113,0.15);
}

.option.disabled {
  pointer-events: none;
  opacity: 0.55;
}

/* =========================
   FEEDBACK
========================= */

.feedback {
  margin-top: 10px;
  text-align: center;
  font-size: 0.92rem;
  font-weight: 700;
  min-height: 24px;
  line-height: 1.2;
}

.feedback.correct {
  color: #4ade80;
}

.feedback.wrong {
  color: #f87171;
}

#next-btn {
  margin-top: 8px;
  padding: 11px;
  font-size: 0.95rem;
}

/* ==================================================
   ESCADA
================================================== */

.ladder {
  background: #0f0a26;
  border: 2px solid #4a3080;
  border-radius: 16px;
  padding: 8px;
  display: flex;
  flex-direction: column-reverse;
  gap: 3px;
  font-size: 0.75rem;
  height: 100%;
  max-height: 100%;
  overflow: hidden;
}

.ladder-item {
  padding: 5px 7px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  color: #8a7ab8;
}

.ladder-item.current {
  background: linear-gradient(90deg,#ff5da2,#ffd166);
  color: #1a0e35;
  font-weight: 800;
}

.ladder-item.passed {
  color: #ffd166;
}

/* ==================================================
   RESULT
================================================== */

.result-emoji {
  font-size: 4rem;
  text-align: center;
  margin-bottom: 10px;
}

.result-title {
  text-align: center;
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 8px;
  color: #ffd166;
}

.result-sub {
  text-align: center;
  color: #c9b8ff;
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: space-around;
  margin-bottom: 26px;
  flex-wrap: wrap;
  gap: 16px;
}

.stat {
  text-align: center;
}

.stat .num {
  font-size: 1.8rem;
  font-weight: 800;
  color: #ff9ec7;
}

.stat .label {
  color: #c9b8ff;
  font-size: 0.85rem;
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;
  margin-top: 12px;
  color: #5b4d8a;
  font-size: 0.8rem;
}

/* ==================================================
   CELULAR
================================================== */

@media (max-width: 700px) {

  body {
    padding: 6px;
    align-items: center;
  }

  .app {
    max-width: 100%;
  }

  /* Enquanto o jogo está aberto,
     título e footer desaparecem para
     liberar espaço vertical. */

  body.game-playing h1,
  body.game-playing .subtitle,
  body.game-playing footer {
    display: none;
  }

  body.game-playing {
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }

  body.game-playing .app {
    height: 100%;
  }

  body.game-playing #game-screen {
    height: 100%;
  }

  /* O GAME SCREEN NÃO VIRA MAIS
     UMA COLUNA */

  .game-layout {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 7px;
    height: 100%;
  }

  .game-layout > .card {
    height: 100%;
    min-height: 0;
    padding: 12px;
    border-radius: 15px;
    overflow: hidden;
  }

  /* Escada compacta embaixo */

  .ladder {
    order: 2;
    height: auto;
    max-height: 82px;

    display: grid;
    grid-template-columns: repeat(5, 1fr);

    gap: 3px;
    padding: 5px;

    overflow: hidden;
    border-radius: 11px;
  }

  .ladder-item {
    padding: 3px 4px;
    font-size: 0.58rem;
    min-height: 20px;
  }

  .top-bar {
    margin-bottom: 7px;
  }

  .question-count {
    font-size: 0.76rem;
  }

  .timer-wrap {
    height: 6px;
    margin-bottom: 8px;
  }

  .turn-banner {
    padding: 7px 8px;
    margin-bottom: 8px;
    font-size: 0.76rem;
    line-height: 1.2;
  }

  .question-text {
    font-size: 1rem;
    min-height: 40px;
    margin-bottom: 9px;
    line-height: 1.25;
  }

  .options {
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .option {
    min-height: 46px;
    padding: 7px;
    font-size: 0.78rem;
    gap: 6px;
    border-radius: 9px;
  }

  .option .letter {
    width: 22px;
    height: 22px;
    font-size: 0.7rem;
  }

  .feedback {
    margin-top: 7px;
    min-height: 20px;
    font-size: 0.78rem;
  }

  #next-btn {
    margin-top: 5px;
    padding: 8px;
    font-size: 0.82rem;
  }
}

/* ==================================================
   CELULARES MUITO PEQUENOS
================================================== */

@media (max-width: 380px) {

  .game-layout > .card {
    padding: 9px;
  }

  .turn-banner {
    font-size: 0.7rem;
  }

  .question-text {
    font-size: 0.92rem;
  }

  .option {
    min-height: 42px;
    padding: 6px;
    font-size: 0.72rem;
  }

  .option .letter {
    width: 20px;
    height: 20px;
  }

  .ladder {
    max-height: 72px;
  }

  .ladder-item {
    font-size: 0.52rem;
  }
}

/* ==================================================
   PAISAGEM NO CELULAR
================================================== */

@media (max-width: 900px) and (orientation: landscape) {

  body.game-playing {
    overflow: hidden;
  }

  body.game-playing h1,
  body.game-playing .subtitle,
  body.game-playing footer {
    display: none;
  }

  .game-layout {
    grid-template-columns: minmax(0, 1fr) 155px;
    grid-template-rows: 1fr;
    height: 100dvh;
  }

  .game-layout > .card {
    padding: 10px;
  }

  .ladder {
    height: 100%;
    max-height: none;
  }

  .option {
    min-height: 40px;
    padding: 6px;
    font-size: 0.75rem;
  }

  .turn-banner {
    padding: 5px;
    margin-bottom: 6px;
  }

  .question-text {
    margin-bottom: 7px;
  }
}

.result-achievements {
  margin: 16px 0;
  font-size: 0.95rem;
  line-height: 1.6;
}
.achievement {
  padding: 8px 10px;
  margin: 6px 0;
  border-radius: 10px;
  background: rgba(255,255,255,.08);
}
</style>

let perguntasdapartida = [];

const QUESTION_CYCLE_KEY = 'quemMeConhecePerguntasUsadas_v2';

function carregarPerguntasUsadas() {
  try {
    const usadas = JSON.parse(localStorage.getItem(QUESTION_CYCLE_KEY) || '[]');
    return Array.isArray(usadas) ? usadas : [];
  } catch (e) {
    return [];
  }
}

function salvarPerguntasUsadas(usadas) {
  localStorage.setItem(QUESTION_CYCLE_KEY, JSON.stringify(usadas));
}

function embaralhar(lista) {
  const copia = [...lista];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function idPergunta(pergunta) {
  return pergunta.q;
}

function SelecionarPerguntasAaleatorias() {
  let usadas = carregarPerguntasUsadas();

  if (usadas.length >= perguntasdapartida.length) usadas = [];

  const disponiveis = QUESTIONS.filter(
    pergunta => !usadas.includes(idPergunta(pergunta))
  );

  let selecionadas = embaralhar(disponiveis).slice(0, 25);

  if (selecionadas.length < 25) {
    const ids = new Set(selecionadas.map(idPergunta));
    const complemento = embaralhar(
      QUESTIONS.filter(pergunta => !ids.has(idPergunta(pergunta)))
    );
    selecionadas = selecionadas.concat(
      complemento.slice(0, 25 - selecionadas.length)
    );
    salvarPerguntasUsadas([]);
  } else {
    const novasUsadas = [...new Set([
      ...usadas,
      ...selecionadas.map(idPergunta)
    ])];
    salvarPerguntasUsadas(
      novasUsadas.length >= perguntasdapartida.length ? [] : novasUsadas
    );
  }

  perguntasdapartida = selecionadas;
}

/* =========================
   ESTADO
========================= */

let state = {};
/* =========================
   DINHEIRO
========================= */

function fmtMoney(v) {
  return v.toLocaleString('pt-MZ') + "MT";
}

/* =========================
   TROCA DE TELA
========================= */

function showScreen(id) {

  document
    .querySelectorAll('.screen')
    .forEach(s => s.classList.remove('active'));

  document
    .getElementById(id)
    .classList.add('active');

  /* Ativa modo tela cheia somente durante o jogo */

  if (id === 'game-screen') {
    document.body.classList.add('game-playing');
  } else {
    document.body.classList.remove('game-playing');
  }
}

/* =========================
   COMEÇAR JOGO
========================= */

function startGame() {

  const p1 = document.getElementById('p1-name').value.trim();
  const p2 = document.getElementById('p2-name').value.trim();

  if (!p1 || !p2) {
    alert('Digite o nome dos dois jogadores para começar.');
    if (!p1) document.getElementById('p1-name').focus();
    else document.getElementById('p2-name').focus();
    return;
  }

  SelecionarPerguntasAaleatorias();

  state = {
    p1,
    p2,
    index: 0,
    phase: 'secret',
    secretAnswer: null,
    correct: 0,
    streak: 0,
    bestStreak: 0,
    bonus: 0,
    timer: null,
    timerTimeout: null,
    timeLeft: 30
  };

  buildLadder();

  showScreen('game-screen');

  loadQuestion();
}

/* =========================
   ESCADA
========================= */

function buildLadder() {

  const ladder =
    document.getElementById('ladder');

  ladder.innerHTML = "";

  LADDER.forEach((val, i) => {

    const item =
      document.createElement('div');

    item.className = 'ladder-item';

    item.id = 'ladder-' + i;

    item.innerHTML = `
      <span>${i + 1}</span>
      <span>${fmtMoney(val)}</span>
    `;

    ladder.appendChild(item);

  });

  updateLadder();
}

/* =========================
   ATUALIZAR ESCADA
========================= */

function updateLadder() {

  LADDER.forEach((val, i) => {

    const el =
      document.getElementById('ladder-' + i);

    if (!el) return;

    el.classList.remove(
      'current',
      'passed'
    );

    if (i === state.index) {

      el.classList.add('current');

    } else if (i < state.correct) {

      el.classList.add('passed');

    }

  });

}

/* =========================
   JOGADORES
========================= */

function currentSecretPlayer() {

  return state.index % 2 === 0
    ? state.p1
    : state.p2;
}

function currentGuesserPlayer() {

  return state.index % 2 === 0
    ? state.p2
    : state.p1;
}

/* =========================
   CARREGAR PERGUNTA
========================= */

function loadQuestion() {

  clearInterval(state.timer);

  state.phase = 'secret';
  state.secretAnswer = null;
  state.timeLeft = 30;

  document.getElementById('question-count')
    .textContent =
    `Pergunta ${state.index + 1} de ${perguntasdapartida.length}`;

  document.getElementById('score-count')
    .textContent =
    `Acertos: ${state.correct}`;

  document.getElementById('next-btn')
    .style.display = 'none';

  document.getElementById('feedback')
    .textContent = '';

  document.getElementById('feedback')
    .className = 'feedback';

  renderSecretPhase();

  updateLadder();

  startTimer();
}

/* =========================
   TIMER
========================= */

function startTimer() {

  const bar = document.getElementById('timer-bar');

  // Cancela qualquer temporizador anterior
  clearInterval(state.timer);
  clearTimeout(state.timerTimeout);

  state.timeLeft = 30;

  bar.style.transition = 'none';
  bar.style.width = '100%';

  // Pequeno atraso apenas para permitir a animação visual da barra
  state.timerTimeout = setTimeout(() => {
    bar.style.transition = 'width 30s linear';
    bar.style.width = '0%';
  }, 50);

  state.timer = setInterval(() => {

    state.timeLeft--;

    if (state.timeLeft <= 0) {

      clearInterval(state.timer);
      clearTimeout(state.timerTimeout);
      state.timer = null;
      state.timerTimeout = null;

      autoAdvanceOnTimeout();
    }

  }, 1000);
}

/* =========================
   TEMPO ESGOTADO
========================= */

function autoAdvanceOnTimeout() {

  if (state.phase === 'secret') {

    const q =
      perguntasdapartida[state.index];

    state.secretAnswer =
      Math.floor(
        Math.random() * q.o.length
      );

    renderGuessPhase();

    startTimer();

  } else {

    handleGuess(-1);

  }
}

/* =========================
   FASE SECRETA
========================= */

function renderSecretPhase() {

  const q =
    perguntasdapartida[state.index];

  const banner =
    document.getElementById('turn-banner');

  banner.className =
    'turn-banner secret';

  banner.textContent =
    `🤫 Vez de ${currentSecretPlayer()}: responda sobre você mesmo(a) — não deixe seu parceiro(a) ver a tela!`;

  document.getElementById('question-text')
    .textContent = q.q;

  const opts =
    document.getElementById('options');

  opts.innerHTML = '';

  q.o.forEach((text, i) => {

    const div =
      document.createElement('div');

    div.className = 'option';

    div.innerHTML = `
      <span class="letter">
        ${String.fromCharCode(65 + i)}
      </span>

      <span>${text}</span>
    `;

    div.onclick = () => {

      state.secretAnswer = i;

      clearInterval(state.timer);

      renderGuessPhase();

      startTimer();

    };

    opts.appendChild(div);

  });
}

/* =========================
   FASE DE ADIVINHAÇÃO
========================= */

function renderGuessPhase() {

  const q =
    perguntasdapartida[state.index];

  const banner =
    document.getElementById('turn-banner');

  banner.className =
    'turn-banner guess';

  banner.textContent =
    `🎯 descubra ${currentGuesserPlayer()}: qual você acha que foi a resposta de ${currentSecretPlayer()}?`;

  document.getElementById('question-text')
    .textContent = q.q;

  const opts =
    document.getElementById('options');

  opts.innerHTML = '';

  q.o.forEach((text, i) => {

    const div =
      document.createElement('div');

    div.className = 'option';

    div.innerHTML = `
      <span class="letter">
        ${String.fromCharCode(65 + i)}
      </span>

      <span>${text}</span>
    `;

    div.onclick = () =>
      handleGuess(i);

    opts.appendChild(div);

  });

  state.phase = 'guess';
}

/* =========================
   VERIFICAR RESPOSTA
========================= */

function handleGuess(guessIndex) {

  // PARA COMPLETAMENTE O TEMPO AO RESPONDER
  clearInterval(state.timer);
  clearTimeout(state.timerTimeout);
  state.timer = null;
  state.timerTimeout = null;

  const bar = document.getElementById('timer-bar');
  if (bar) {
    bar.style.transition = 'none';
    bar.style.width = `${Math.max(0, (state.timeLeft / 30) * 100)}%`;
  }

  const opts =
    document.querySelectorAll(
      '#options .option'
    );

  opts.forEach(o =>
    o.classList.add('disabled')
  );

  const correctIndex =
    state.secretAnswer;

  const feedback =
    document.getElementById('feedback');

  if (guessIndex === correctIndex) {

    if (opts[guessIndex]) {
      opts[guessIndex].classList.add('correct');
    }

    state.correct++;
    state.streak++;
    state.bestStreak = Math.max(
      state.bestStreak,
      state.streak
    );

    const speedBonus =
      Math.max(0, Math.floor(state.timeLeft / 5));

    state.bonus += speedBonus;

    feedback.textContent =
      `🎉 Acertou! 🔥 Sequência: ${state.streak}` +
      (speedBonus ? ` +${speedBonus} bônus` : '');

    feedback.className =
      'feedback correct';

  } else {

    if (opts[correctIndex]) {
      opts[correctIndex].classList.add('correct');
    }

    if (guessIndex >= 0 && opts[guessIndex]) {
      opts[guessIndex].classList.add('wrong');
    }

    feedback.textContent =
      "💔 Não foi dessa vez... bom motivo pra conversarem mais!";

    feedback.className =
      'feedback wrong';

    state.streak = 0;
  }

  document.getElementById('score-count')
    .textContent =
    `Acertos: ${state.correct}`;

  const streakEl =
    document.getElementById('streak-count');

  if (streakEl) {
    streakEl.textContent =
      `🔥 Sequência: ${state.streak}`;
  }

  updateLadder();

  // ÚLTIMA PERGUNTA: vai direto para os resultados.
  if (state.index >= perguntasdapartida.length - 1) {

    document.getElementById('next-btn')
      .style.display = 'none';

    setTimeout(() => {
      finishGame();
    }, 700);

    return;
  }

  // Nas outras perguntas, mostra o botão normalmente.
  document.getElementById('next-btn')
    .style.display = 'block';
}

/* =========================
   PRÓXIMA PERGUNTA
========================= */

function nextStep() {

  clearInterval(state.timer);
  clearTimeout(state.timerTimeout);
  state.timer = null;
  state.timerTimeout = null;

  state.index++;

  if (state.index >= perguntasdapartida.length) {

    finishGame();

  } else {

    loadQuestion();

  }
}

/* =========================
   FINAL DO JOGO
========================= */

function finishGame() {

  clearInterval(state.timer);
  clearTimeout(state.timerTimeout);
  state.timer = null;
  state.timerTimeout = null;

  const total =
    perguntasdapartida.length;

  const percent =
    Math.round(
      (state.correct / total) * 100
    );

  const prizeIndex =
    Math.min(
      Math.max(state.correct - 1, 0),
      LADDER.length - 1
    );

  const prize =
    state.correct === 0
      ? 0
      : LADDER[prizeIndex];

  let emoji;
  let title;
  let sub;

  if (percent >= 90) {

    emoji = "💞";
    title = "Almas Gêmeas!";

    sub =
      `${state.p1} e ${state.p2} se conhecem de um jeito raro. Nível de conexão máximo!`;

  } else if (percent >= 70) {

    emoji = "😍";
    title = "Casal Afinado!";

    sub =
      `Vocês dois realmente prestam atenção um no outro. Continuem assim!`;

  } else if (percent >= 50) {

    emoji = "😄";
    title = "No Caminho Certo!";

    sub =
      `Ainda há descobertas por vir — e isso também é parte da graça!`;

  } else {

    emoji = "💬";
    title = "Hora de Conversar Mais!";

    sub =
      `Aproveitem essa noite para se conhecerem um pouquinho mais.`;
  }

  document.getElementById('result-emoji')
    .textContent = emoji;

  document.getElementById('result-title')
    .textContent = title;

  document.getElementById('result-sub')
    .textContent = sub;

  document.getElementById('stat-correct')
    .textContent =
    `${state.correct}/${total}`;

  document.getElementById('stat-percent')
    .textContent =
    `${percent}%`;

  document.getElementById('stat-prize')
    .textContent =
    fmtMoney(prize);

  const streakEl = document.getElementById('stat-streak');
  if (streakEl) streakEl.textContent = state.bestStreak;

  const achievements = [];
  if (state.correct >= 1) achievements.push('🏅 Primeiro acerto');
  if (state.bestStreak >= 5) achievements.push('🔥 Sequência de 5');
  if (state.bestStreak >= 10) achievements.push('💥 Sequência de 10');
  if (percent === 100) achievements.push('💎 Perfeição');
  if (state.bonus >= 20) achievements.push('⚡ Mestre da velocidade');

  const achievementEl = document.getElementById('result-achievements');
  if (achievementEl) {
    achievementEl.innerHTML = achievements.length
      ? achievements.map(a => `<div class="achievement">${a}</div>`).join('')
      : '<div class="achievement">🎯 Continue jogando para desbloquear conquistas!</div>';
  }

  salvarHistorico({
    data: new Date().toLocaleString('pt-BR'),
    jogadores: `${state.p1} & ${state.p2}`,
    acertos: state.correct,
    percent,
    melhorSequencia: state.bestStreak,
    bonus: state.bonus,
    premio: prize
  });

  showScreen('result-screen');
}

/* =========================
   REINICIAR
========================= */

function salvarHistorico(partida) {
  try {
    const historico = JSON.parse(
      localStorage.getItem('quemMeConheceHistorico_v1') || '[]'
    );
    historico.unshift(partida);
    localStorage.setItem(
      'quemMeConheceHistorico_v1',
      JSON.stringify(historico.slice(0, 20))
    );
  } catch (e) {}
}

function resetGame() {

  document.getElementById('p1-name')
    .value = state.p1 || '';

  document.getElementById('p2-name')
    .value = state.p2 || '';

  showScreen('setup-screen');
}
